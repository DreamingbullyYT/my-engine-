name: CodeGraphContext Index

on:
  push:
    branches: [main, godot-4.7.2-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Build code graph and publish AI-readable map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install CodeGraphContext
        run: |
          python -m pip install --upgrade pip
          python -m pip install "codegraphcontext==0.5.1" "tree-sitter-gdscript==6.1.0"
          cgc --version

      - name: Smoke-test C++ and Lua indexing in an isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/codegraph-smoke"
          mkdir -p "$fixture/src" "$fixture/scripts"
          cat > "$fixture/src/math.cpp" <<'EOF'
          int helper(int value) {
              return value + 1;
          }

          int calculate(int value) {
              return helper(value) * 2;
          }
          EOF
          cat > "$fixture/src/math.hpp" <<'EOF'
          #pragma once
          int helper(int value);
          int calculate(int value);
          EOF
          cat > "$fixture/scripts/init.lua" <<'EOF'
          local function normalize(value)
              return value + 1
          end

          function start_game(value)
              return normalize(value) * 2
          end
          EOF

          cgc index "$fixture" --force 2>&1 | tee "$RUNNER_TEMP/codegraph-smoke-index.log"
          cgc stats "$fixture" 2>&1 | tee "$RUNNER_TEMP/codegraph-smoke-stats.log"
          cgc analyze calls calculate 2>&1 | tee "$RUNNER_TEMP/codegraph-smoke-calls.log"
          cgc bundle export "$RUNNER_TEMP/codegraph-smoke.cgc" --repo "$fixture"
          test -s "$RUNNER_TEMP/codegraph-smoke.cgc"
          {
            echo "## CodeGraphContext isolated smoke test"
            echo "- C++ and Lua fixture indexing: **passed**"
            echo "- Graph statistics command: **passed**"
            echo "- Call analysis command: **passed**"
            echo "- Portable .cgc bundle export: **passed**"
            echo "- Bundle size: $(stat -c%s "$RUNNER_TEMP/codegraph-smoke.cgc") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test dedicated GDScript indexing
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/gdscript-smoke"
          mkdir -p "$fixture/scripts"
          cat > "$fixture/scripts/smoke.gd" <<'EOF'
          class_name SmokeScript
          extends RefCounted

          func helper(value: int) -> int:
              return value + 1

          func calculate(value: int) -> int:
              return helper(value) * 2
          EOF
          python .github/scripts/gdscript_code_map.py \
            --root "$fixture" \
            --output "$RUNNER_TEMP/gdscript-smoke-map.md" \
            --commit "$GITHUB_SHA" \
            --expect-call calculate:helper
          grep -F "calculate()" "$RUNNER_TEMP/gdscript-smoke-map.md"
          grep -F "calls helper()" "$RUNNER_TEMP/gdscript-smoke-map.md"
          {
            echo "## GDScript structural smoke test"
            echo "- Dedicated Tree-sitter parser: **passed**"
            echo "- Local call edge calculate() -> helper(): **passed**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Detect source code
        id: source
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
               -o -name '*.lua' -o -name '*.py' -o -name '*.rs' \
               -o -name '*.cs' -o -name '*.java' -o -name '*.kt' -o -name '*.js' \
               -o -name '*.ts' -o -name '*.go' -o -name '*.swift' \) \
            -not -path './.git/*' -not -path './.github/*' \
            -not -path './.venv/*' -not -path './build/*' \
            -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create status report (no source yet)
        if: steps.source.outputs.present != 'true'
        run: |
          mkdir -p PMCS
          {
            echo "# CodeGraphContext Code Map"
            echo
            echo "- Status: **NO_SOURCE_CODE_TO_INDEX**"
            echo "- Commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No CodeGraphContext-supported source files were detected; GDScript is not supported by this indexer."
            echo "CodeGraphContext indexing is skipped when the repository contains only unsupported source formats."
            echo "This is not evidence that an engine implementation exists."
          } > PMCS/CODE_MAP.md

      - name: Generate dedicated GDScript code map
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/gdscript_code_map.py \
            --root . \
            --output PMCS/GDSCRIPT_CODE_MAP.md \
            --commit "$GITHUB_SHA" \
            --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Assemble portable code map
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Dream Engine Code Map"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## GDScript"
            cat PMCS/GDSCRIPT_CODE_MAP.md
            echo
            echo "## CodeGraphContext (supported native/script languages)"
            cat .codegraphcontext/NATIVE_CODE_MAP.md
          } > PMCS/CODE_MAP.md
      - name: Index repository
        if: steps.source.outputs.present == 'true'
        run: |
          cgc index . --force

      - name: Generate AI-readable analysis
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p .codegraphcontext
          {
            echo "# CodeGraphContext Code Map"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Indexer: CodeGraphContext 0.5.1"
            echo
            echo "## Index statistics"
            cgc stats . || true
            echo
            echo "## High-complexity functions (threshold 10)"
            cgc analyze complexity --threshold 10 || true
            echo
            echo "## Potential dead code"
            cgc analyze dead-code || true
          } > .codegraphcontext/NATIVE_CODE_MAP.md
          cgc bundle export .codegraphcontext/dream-engine.cgc --repo .

      - name: Upload graph and readable report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: codegraphcontext-${{ github.sha }}
          path: |
            PMCS/CODE_MAP.md
            PMCS/GDSCRIPT_CODE_MAP.md
            .codegraphcontext/NATIVE_CODE_MAP.md
            .codegraphcontext/dream-engine.cgc
            ${{ runner.temp }}/codegraph-smoke.cgc
            ${{ runner.temp }}/codegraph-smoke-index.log
            ${{ runner.temp }}/codegraph-smoke-stats.log
            ${{ runner.temp }}/codegraph-smoke-calls.log
            ${{ runner.temp }}/gdscript-smoke-map.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed code map on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- PMCS/CODE_MAP.md; then
            echo "Code map is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PMCS/CODE_MAP.md
          git commit -m "docs(pmcs): refresh CodeGraphContext map [skip ci]"
          git push
