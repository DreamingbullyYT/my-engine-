name: CodeGraphContext Index

on:
  push:
    branches: [main, godot-4.7.2-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Build code graph and publish AI-readable map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install CodeGraphContext
        run: |
          python -m pip install --upgrade pip
          python -m pip install "codegraphcontext==0.5.1"
          cgc --version

      - name: Detect source code
        id: source
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
               -o -name '*.lua' -o -name '*.py' -o -name '*.rs' -o -name '*.gd' \
               -o -name '*.cs' -o -name '*.java' -o -name '*.kt' -o -name '*.js' \
               -o -name '*.ts' -o -name '*.go' -o -name '*.swift' \) \
            -not -path './.git/*' -not -path './.github/*' \
            -not -path './.venv/*' -not -path './build/*' \
            -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create status report (no source yet)
        if: steps.source.outputs.present != 'true'
        run: |
          mkdir -p PMCS
          {
            echo "# CodeGraphContext Code Map"
            echo
            echo "- Status: **NO_SOURCE_CODE_TO_INDEX**"
            echo "- Commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "The active repository tree currently contains project documentation only."
            echo "CodeGraphContext was installed successfully, but indexing is deferred until source files are added."
            echo "This is not evidence that an engine implementation exists."
          } > PMCS/CODE_MAP.md

      - name: Index repository
        if: steps.source.outputs.present == 'true'
        run: |
          cgc index . --force --summarize

      - name: Generate AI-readable analysis
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p .codegraphcontext
          {
            echo "# CodeGraphContext Code Map"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Indexer: CodeGraphContext 0.5.1"
            echo
            echo "## Index statistics"
            cgc stats . || true
            echo
            echo "## High-complexity functions (threshold 10)"
            cgc analyze complexity --threshold 10 || true
            echo
            echo "## Potential dead code"
            cgc analyze dead-code || true
          } > PMCS/CODE_MAP.md
          cgc bundle export .codegraphcontext/dream-engine.cgc --repo .

      - name: Upload graph and readable report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: codegraphcontext-${{ github.sha }}
          path: |
            PMCS/CODE_MAP.md
            .codegraphcontext/dream-engine.cgc
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed code map on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- PMCS/CODE_MAP.md; then
            echo "Code map is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PMCS/CODE_MAP.md
          git commit -m "docs(pmcs): refresh CodeGraphContext map [skip ci]"
          git push
