name: M1 Android ARM64

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - "app/**"
      - "core/**"
      - "ui/**"
      - "mods/**"
      - "native/**"
      - "tests/**"
      - ".github/scripts/build_dream_runtime.sh"
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.res"
      - "**/*.gdshader"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.ogg"
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.json"
      - "**/*.cfg"
      - ".github/workflows/android-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_VERSION_DIR: "4.7.2.stable"
  ANDROID_SDK_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_NDK_VERSION: "28.1.13356709"

jobs:
  android-arm64:
    name: Export and validate Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platforms;android-35 build-tools;35.0.1 ndk;28.1.13356709"

      - name: Install SCons
        run: |
          sudo apt-get update
          sudo apt-get install -y scons
          scons --version
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache official Godot Android export templates
        id: godot-templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-android-arm64-templates-v1

      - name: Download official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-linux.zip"
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          editor="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          test -s "$editor"
          chmod +x "$editor"
          echo "GODOT_BIN=$editor" >> "$GITHUB_ENV"
          echo "Godot editor downloaded and checksum verified."

      - name: Install official Android export templates
        if: steps.godot-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-export-templates.tpz"
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $archive" | sha256sum --check

          for template in android_debug.apk android_release.apk android_source.zip; do
            unzip -Z1 "$archive" | grep -Fx "templates/$template" >/dev/null
          done

          destination="$HOME/.local/share/godot/export_templates/$GODOT_VERSION_DIR"
          temporary="$RUNNER_TEMP/godot-templates"
          mkdir -p "$destination" "$temporary"
          unzip -q "$archive" \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            "templates/android_source.zip" \
            -d "$temporary"
          cp "$temporary/templates/"* "$destination/"
          printf '%s\n' "$GODOT_VERSION_DIR" > "$destination/version.txt"

          test -s "$destination/android_debug.apk"
          test -s "$destination/android_release.apk"
          test -s "$destination/android_source.zip"
          echo "Official Android export templates installed and checksum verified."

      - name: Download and verify official Godot
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version
          java -version
          test -d "$ANDROID_HOME/platforms/android-$ANDROID_SDK_PLATFORM"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          test -s "$HOME/.local/share/godot/export_templates/$GODOT_VERSION_DIR/android_debug.apk"
          test -d "$ANDROID_NDK_ROOT"
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_ROOT"

      - name: Run city and citizen gameplay smoke tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/gameplay_smoke.gd
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/city_view_smoke.gd

      - name: Build Linux and Android Dream Runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/build_dream_runtime.sh linux x86_64
          bash .github/scripts/build_dream_runtime.sh android arm64
          test -s native/dream_runtime/bin/linux/libdream_runtime.linux.template_debug.x86_64.so
          test -s native/dream_runtime/bin/android/libdream_runtime.android.template_debug.arm64.so

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-debug \
            "Android ARM64 Debug" build/android/dream-engine-debug.apk
          test -s build/android/dream-engine-debug.apk
          unzip -tq build/android/dream-engine-debug.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging \
            build/android/dream-engine-debug.apk > build/android/apk-badging.txt
          grep -F "package: name='com.dreamingbully.dreamengine'" build/android/apk-badging.txt
          unzip -Z1 build/android/dream-engine-debug.apk | grep -F "lib/arm64-v8a/libgodot_android.so"
          unzip -Z1 build/android/dream-engine-debug.apk | grep -F "lib/arm64-v8a/libdream_runtime.android.template_debug.arm64.so"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Godot: $("$GODOT_BIN" --version)"
            echo "Target: Android arm64-v8a"
            echo "Native extension: DreamRuntimeProbe"
            echo "Package: com.dreamingbully.dreamengine"
            echo "Build type: debug"
          } > build/android/build-info.txt
          stat -c "APK size: %s bytes" build/android/dream-engine-debug.apk

      - name: Upload APK and validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dream-engine-playable-slice-${{ github.sha }}-android-arm64
          path: |
            build/android/dream-engine-debug.apk
            build/android/apk-badging.txt
            build/android/build-info.txt
            native/dream_runtime/bin/android/libdream_runtime.android.template_debug.arm64.so
            native/dream_runtime/bin/linux/libdream_runtime.linux.template_debug.x86_64.so
          if-no-files-found: error
          retention-days: 30
