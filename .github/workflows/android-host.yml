name: Android host APK

on:
  push:
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-host.yml"
  pull_request:
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-engine-android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-arm64-apk:
    name: Assemble GameActivity host / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, CMake and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.31.6" "ndk;28.2.13676358"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble debug APK
        working-directory: android-host
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contains ARM64 native host
        run: |
          APK="android-host/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdream_engine_android_host.so"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-engine-android-host-arm64-debug
          path: android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test debug APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK="android-host/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android-host/app/build.gradle.kts | head -n 1)"
            test -n "$PACKAGE_ID"
            adb install -r "$APK"
            adb shell monkey -p "$PACKAGE_ID" 1
            sleep 8
            adb shell pidof "$PACKAGE_ID"
            adb shell am force-stop "$PACKAGE_ID"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream-engine-android-host-arm64-debug
          path: android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
