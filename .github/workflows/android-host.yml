name: Android host APK

on:
  push:
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-host.yml"
  pull_request:
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-engine-android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-arm64-apk:
    name: Assemble playable GameActivity host / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned bgfx sources
        run: |
          git clone --filter=blob:none https://github.com/bkaradzic/bgfx.cmake.git /tmp/bgfx.cmake
          git -C /tmp/bgfx.cmake fetch --depth 1 origin c07b70ddc18d84538a460d6b022b6bb22d0e0950
          git -C /tmp/bgfx.cmake checkout --detach FETCH_HEAD

          git clone --filter=blob:none https://github.com/bkaradzic/bgfx.git /tmp/bgfx
          git -C /tmp/bgfx fetch --depth 1 origin 3fe177f616c712a84a39e597a404ac5fdc04a3f7
          git -C /tmp/bgfx checkout --detach FETCH_HEAD

          git clone --filter=blob:none https://github.com/bkaradzic/bx.git /tmp/bx
          git -C /tmp/bx fetch --depth 1 origin b8ee10a606ae41db9fdd1dbb2bb4d1e565f9a7b7
          git -C /tmp/bx checkout --detach FETCH_HEAD

          git clone --filter=blob:none https://github.com/bkaradzic/bimg.git /tmp/bimg
          git -C /tmp/bimg fetch --depth 1 origin 38ceda5c7778228f976f75900623fb5923b49107
          git -C /tmp/bimg checkout --detach FETCH_HEAD

          echo "BGFX_CMAKE_SOURCE_DIR=/tmp/bgfx.cmake" >> "$GITHUB_ENV"
          echo "BGFX_DIR=/tmp/bgfx" >> "$GITHUB_ENV"
          echo "BX_DIR=/tmp/bx" >> "$GITHUB_ENV"
          echo "BIMG_DIR=/tmp/bimg" >> "$GITHUB_ENV"

      - name: Verify pinned precompiled GLES 3 shader assets
        run: |
          cd android-host/app/src/main/assets/shaders
          sha256sum --check SHA256SUMS
          test -s vs_sprite_essl300.bin
          test -s fs_sprite_essl300.bin
          test -s vs_mesh_essl300.bin
          test -s fs_mesh_essl300.bin

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, CMake and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.31.6" "ndk;28.2.13676358"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble debug APK with EngineRuntime and bgfx
        working-directory: android-host
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: gradle --no-daemon --no-build-cache --max-workers=1 --stacktrace :app:clean :app:assembleDebug

      - name: Verify APK contains ARM64 engine, renderer, shaders and startup diagnostics
        run: |
          APK="android-host/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdream_engine_android_host.so"
          unzip -l "$APK" | grep -q "assets/shaders/vs_sprite_essl300.bin"
          unzip -l "$APK" | grep -q "assets/shaders/vs_mesh_essl300.bin"

          # Verify the packaged DEX includes the current Java startup diagnostics.
          DEX_HAS_MARKER=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -q "DreamEngineBoot"; then
              DEX_HAS_MARKER=1
              break
            fi
          done
          test "$DEX_HAS_MARKER" -eq 1
          unzip -p "$APK" lib/arm64-v8a/libdream_engine_android_host.so | strings | grep -q "android_main entered"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-engine-android-arm64-debug
          path: android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
