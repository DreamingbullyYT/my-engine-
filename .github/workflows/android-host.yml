name: Android host APK

on:
  push:
    branches:
      - main
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - "third_party/wgpu-native/**"
      - "third_party/webgpu-headers/**"
  pull_request:
    branches:
      - main
    paths:
      - "android-host/**"
      - "engine/**"
      - "CMakeLists.txt"
      - "PMCS/**"
      - "third_party/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/android-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-engine-android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-arm64-apk:
    name: Assemble wgpu GameActivity host / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned wgpu-native Android ARM64 release
        env:
          WGPU_NATIVE_VERSION: v29.0.1.1
          WGPU_NATIVE_SHA256: 721741f1b05a20c1738166bedf7a5efb2ba4b382da689526d3fc33de22bdd573
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wgpu-android-aarch64-release.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_NATIVE_VERSION/wgpu-android-aarch64-release.zip" \
            --output "$archive"
          echo "$WGPU_NATIVE_SHA256  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/wgpu-native"
          unzip -q "$archive" -d "$RUNNER_TEMP/wgpu-native"
          test -s "$RUNNER_TEMP/wgpu-native/include/webgpu/webgpu.h"
          test -s "$RUNNER_TEMP/wgpu-native/include/webgpu/wgpu.h"
          test -s "$RUNNER_TEMP/wgpu-native/lib/libwgpu_native.so"
          # The upstream Android .so is shipped without DT_SONAME. Give it a
          # stable SONAME so lld records [libwgpu_native.so], never a CI path.
          sudo apt-get update
          sudo apt-get install --yes patchelf
          patchelf --set-soname libwgpu_native.so "$RUNNER_TEMP/wgpu-native/lib/libwgpu_native.so"
          readelf -d "$RUNNER_TEMP/wgpu-native/lib/libwgpu_native.so" | grep -F '[libwgpu_native.so]'
          echo "WGPU_NATIVE_ROOT=$RUNNER_TEMP/wgpu-native" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, CMake and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "cmake;3.31.6" "ndk;28.2.13676358"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble debug APK with EngineRuntime and wgpu-native clear/present backend
        working-directory: android-host
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: gradle --no-daemon --no-build-cache --max-workers=1 --stacktrace :app:clean :app:assembleDebug

      - name: Verify APK contains ARM64 engine, wgpu-native and startup diagnostics
        run: |
          APK="android-host/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdream_engine_android_host.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libwgpu_native.so"

          # Verify the packaged DEX includes the current Java startup diagnostics.
          DEX_HAS_MARKER=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -q "DreamEngineBoot"; then
              DEX_HAS_MARKER=1
              break
            fi
          done
          test "$DEX_HAS_MARKER" -eq 1
          unzip -p "$APK" lib/arm64-v8a/libdream_engine_android_host.so > "$RUNNER_TEMP/host.so"
          NEEDED="$(readelf -d "$RUNNER_TEMP/host.so" | grep "(NEEDED)" || true)"
          echo "$NEEDED"
          test -n "$NEEDED"
          # DT_NEEDED must be bare library names, never absolute build paths.
          if printf '%s\\n' "$NEEDED" | grep -q '/'; then
            echo "::error::libdream_engine_android_host.so has an absolute-path DT_NEEDED entry"
            exit 1
          fi
          if ! printf '%s\\n' "$NEEDED" | grep -Fq '[libwgpu_native.so]'; then
            echo "::error::libdream_engine_android_host.so does not declare libwgpu_native.so in DT_NEEDED"
            exit 1
          fi
          unzip -p "$APK" lib/arm64-v8a/libdream_engine_android_host.so | strings | grep -q "android_main entered"
          unzip -p "$APK" lib/arm64-v8a/libdream_engine_android_host.so | strings | grep -q "wgpu-native"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-engine-android-arm64-debug
          path: android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
