name: Dream Engine CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc g++ clang

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDREAM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  chaiscript-ast-proof:
    name: DMod / ChaiScript direct AST proof
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Dream Engine
        uses: actions/checkout@v4

      - name: Checkout pinned ChaiScript source
        run: |
          git init /tmp/chaiscript
          git -C /tmp/chaiscript remote add origin https://github.com/ChaiScript/ChaiScript.git
          git -C /tmp/chaiscript fetch --depth 1 origin f635b51e3f8e95868210edfc66fdbd8e475710f5
          git -C /tmp/chaiscript checkout --detach FETCH_HEAD

      - name: Build direct AST interpreter proof
        run: |
          c++ -std=c++20 -DCHAISCRIPT_NO_DYNLOAD \
            -I/tmp/chaiscript/include \
            tests/dmod/chaiscript_ast_proof.cpp \
            -pthread -o /tmp/chaiscript-ast-proof

      - name: Verify direct AST evaluation without compiled AST nodes
        run: /tmp/chaiscript-ast-proof

  android-arm64:
    name: Android / arm64-v8a (ARMv8-A)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDREAM_BUILD_TESTS=OFF

      - name: Build Android ARM64
        run: cmake --build build-android --parallel 2

      - name: Download AndroidX GameActivity 4.4.2 headers
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/games/games-activity/4.4.2/games-activity-4.4.2.aar \
            --output /tmp/games-activity-4.4.2.aar
          mkdir -p /tmp/games-activity-aar
          unzip -q /tmp/games-activity-4.4.2.aar -d /tmp/games-activity-aar
          test -f /tmp/games-activity-aar/prefab/modules/game-activity/include/game-activity/native_app_glue/android_native_app_glue.h

      - name: Cross-compile Android GameActivity backend for ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -Wpedantic \
            -Iengine/platform/include -Iengine/platform/android/include \
            -I/tmp/games-activity-aar/prefab/modules/game-activity/include \
            -c engine/platform/android/src/game_activity_backend.cpp \
            -o /tmp/game-activity-backend-android.o

      - name: Cross-compile Android APK asset filesystem for ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -Wpedantic \
            -Iengine/platform/include -Iengine/platform/android/include \
            -c engine/platform/android/src/android_asset_filesystem.cpp \
            -o /tmp/android-asset-filesystem-android.o

      - name: Cross-compile resource store tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include \
            -c tests/core/resource_store_tests.cpp \
            -o /tmp/resource-store-tests-android.o

      - name: Cross-compile asset cache tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/assets/include \
            -c tests/assets/asset_cache_tests.cpp \
            -o /tmp/asset-cache-tests-android.o

      - name: Cross-compile asset dependency tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/assets/include \
            -c tests/assets/dependency_graph_tests.cpp \
            -o /tmp/asset-dependency-tests-android.o

      - name: Cross-compile asset loader tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/assets/include \
            -c tests/assets/asset_loader_tests.cpp \
            -o /tmp/asset-loader-tests-android.o

      - name: Cross-compile runtime integration tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/world/include -Iengine/serialization/include -Iengine/input/include -Iengine/physics2d/include -Iengine/render/include -Iengine/runtime/include -Iengine/dmod/include \
            -c tests/runtime/engine_runtime_tests.cpp \
            -o /tmp/runtime-integration-tests-android.o

      - name: Cross-compile renderer frame builder tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/world/include -Iengine/serialization/include -Iengine/render/include \
            -c tests/render/render_frame_builder_tests.cpp \
            -o /tmp/render-frame-builder-tests-android.o

      - name: Cross-compile renderer contract tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/world/include -Iengine/serialization/include -Iengine/render/include \
            -c tests/render/render_contract_tests.cpp \
            -o /tmp/render-contract-tests-android.o

      - name: Cross-compile 3D physics geometry tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \\
            -std=c++20 -Iengine/physics3d/include \\
            -c tests/physics3d/geometry_tests.cpp \\
            -o /tmp/physics3d-geometry-tests-android.o

      - name: Cross-compile 2D physics world tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/physics2d/include \
            -c tests/physics2d/physics_world_tests.cpp \
            -o /tmp/physics2d-world-tests-android.o

      - name: Cross-compile 2D physics broadphase tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/physics2d/include \
            -c tests/physics2d/broadphase_tests.cpp \
            -o /tmp/physics2d-broadphase-tests-android.o

      - name: Cross-compile 2D physics geometry tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/physics2d/include \
            -c tests/physics2d/geometry_tests.cpp \
            -o /tmp/physics2d-geometry-tests-android.o

      - name: Cross-compile input action map tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/platform/include -Iengine/input/include \
            -c tests/input/action_map_tests.cpp \
            -o /tmp/input-action-map-tests-android.o

      - name: Cross-compile scene archive tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/world/include -Iengine/serialization/include \
            -c tests/world/scene_archive_tests.cpp \
            -o /tmp/scene-archive-tests-android.o

      - name: Cross-compile fixed-step clock tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include \
            -c tests/core/fixed_step_clock_tests.cpp \
            -o /tmp/fixed-step-clock-tests-android.o

      - name: Cross-compile world camera tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/world/include -Iengine/serialization/include \
            -c tests/world/camera_tests.cpp \
            -o /tmp/world-camera-tests-android.o

      - name: Cross-compile world archive tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/world/include -Iengine/serialization/include \
            -c tests/world/world_archive_tests.cpp \
            -o /tmp/world-archive-tests-android.o

      - name: Cross-compile binary archive tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/serialization/include \
            -c tests/serialization/binary_archive_tests.cpp \
            -o /tmp/binary-archive-tests-android.o

      - name: Cross-compile world scheduler tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/world/include \
            -c tests/world/system_scheduler_tests.cpp \
            -o /tmp/world-scheduler-tests-android.o

      - name: Cross-compile world ECS tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/world/include \
            -c tests/world/world_tests.cpp \
            -o /tmp/world-tests-android.o

      - name: Cross-compile asset load scope tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/assets/include \
            -c tests/assets/asset_load_scope_tests.cpp \
            -o /tmp/asset-load-scope-tests-android.o

      - name: Cross-compile asset request coordinator tests for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/platform/include -Iengine/assets/include \
            -c tests/assets/asset_request_coordinator_tests.cpp \
            -o /tmp/asset-request-coordinator-tests-android.o

      - name: Cross-compile native DMod package installer for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/dmod/include \
            -c engine/dmod/src/native_mod_package_installer.cpp \
            -o /tmp/native-mod-installer-android.o

      - name: Cross-compile native DMod runtime for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/dmod/include \
            -Ibuild-android/_deps/miniz-src -Ibuild-android \
            -c tests/dmod/native_mod_runtime_tests.cpp -o /tmp/native-mod-runtime-android.o
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Iengine/core/include -Iengine/dmod/include \
            -c tests/dmod/native_mod_test_plugin.cpp -o /tmp/native-mod-plugin-android.o

      - name: Checkout pinned ChaiScript source
        run: |
          git init /tmp/chaiscript
          git -C /tmp/chaiscript remote add origin https://github.com/ChaiScript/ChaiScript.git
          git -C /tmp/chaiscript fetch --depth 1 origin f635b51e3f8e95868210edfc66fdbd8e475710f5
          git -C /tmp/chaiscript checkout --detach FETCH_HEAD

      - name: Cross-compile ChaiScript AST proof for Android ARM64
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -DCHAISCRIPT_NO_DYNLOAD \
            -I/tmp/chaiscript/include \
            tests/dmod/chaiscript_ast_proof.cpp \
            -pthread -o /tmp/chaiscript-ast-proof-android
